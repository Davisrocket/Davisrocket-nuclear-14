      map: [ "cover" ]
    - state: fallout_decor_stripe_null
      color: "#453f3a"
      map: [ "decor" ]
    - state: fallout_icon_null
      map: [ "icon" ]
    - state: fallout_overlay_null
      map: [ "overlay" ]
  - type: Paper
    contentSize: 12000
  - type: ActivatableUI
    key: enum.PaperUiKey.Key
  - type: UserInterface
    interfaces:
      enum.PaperUiKey.Key:
        type: PaperBoundUserInterface
  - type: Tag
    tags:
