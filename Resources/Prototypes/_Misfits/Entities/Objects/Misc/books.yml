#MARK: Bookbase
- type: entity
  name: Pre-War Book
  parent: BaseItem
  id: FalloutBookBase
  description: A pre-war book that has survived the fallout.
  components:
  - type: Sprite
    sprite: \Resources\Textures\_Misfits\Objects\Misc\books.rsi
    layers:
    - state: paper
    - state: fallout_cover_base
      color: "#332d27"
      map: [ "cover" ]
    - state: fallout_decor_stripe
      color: "#453f3a"
      map: [ "decor" ]
    - state: fallout_icon_null
      map: [ "icon" ]
    - state: fallout_overlay_null
      map: [ "overlay" ]
  - type: Paper
    contentSize: 12000
  - type: ActivatableUI
    key: enum.PaperUiKey.Key
  - type: UserInterface
    interfaces:
      enum.PaperUiKey.Key:
        type: PaperBoundUserInterface
  - type: Tag
    tags:
      - Book
  - type: PaperVisuals
    backgroundImagePath: "/Textures/Interface/Paper/paper_background_book.svg.96dpi.png"
    backgroundPatchMargin: 14.0, 15.0, 23.0, 16.0
    contentMargin: 20.0, 20.0, 20.0, 20.0
  - type: EmitSoundOnPickup
    sound: /Audio/SimpleStation14/Items/Handling/book_pickup.ogg
  - type: EmitSoundOnDrop
    sound: /Audio/SimpleStation14/Items/Handling/book_drop.ogg
  - type: EmitSoundOnLand
    sound: /Audio/SimpleStation14/Items/Handling/book_drop.ogg

- type: entity
  name: Burned Book
  parent: BaseItem
  id: FalloutBookBaseBurned
  description: A book that has not survived the fallout.
  components:
  - type: Sprite
    sprite: \Resources\Textures\_Misfits\Objects\Misc\books.rsi
