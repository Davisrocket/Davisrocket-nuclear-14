#MARK: BookRandomStory
- type: entity
  parent: FalloutBookRandomPreWar
  id: FalloutBookRandomStoryPreWar
  suffix: random visual, random story, pre-war
  components:
  - type: PaperRandomStory
    storySegments:
    - "This is a "
    - book_genre
    - " about a "
    - book_character_trait
    - " "
    - book_character
    - " and "
    - book_character_trait
    - " "
    - book_character
    - ". Due to "
    - book_event
    - ", they "
    - book_action_trait
    - " "
    - book_action
    - " "
    - book_character
    - " "
    - book_location
    - ". \n\n"
    - book_story_element
    - " is "
    - book_story_element_trait
    - "."
    storySeparator: ""

